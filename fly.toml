# fly.toml — Oracle Readiness MCP Server on Fly.io
# https://fly.io/docs/reference/configuration/

app            = "oraclereadinesssrc-dzxnqq"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  READINESS_DATA_DIR          = "/data"
  READINESS_HTTP_HOST         = "0.0.0.0"
  READINESS_HTTP_PORT         = "8080"
  READINESS_REFRESH_HOURS     = "6"
  READINESS_AUTOSTART_REFRESH = "1"
  PYTHONUNBUFFERED            = "1"

[mounts]
  source      = "oracle_readiness_data"
  destination = "/data"

[http_service]
  internal_port       = 8080
  force_https         = true
  auto_stop_machines  = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type       = "requests"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory   = "256mb"
  cpu_kind = "shared"
  cpus     = 1
